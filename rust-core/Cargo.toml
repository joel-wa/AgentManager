[package]
name = "agent-workspace-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for Ollama Agent Workspace"
authors = ["Agent Manager Team"]

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
reqwest = { version = "0.11", features = ["json", "stream"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
directories = "5"
dirs = "5"
async-stream = "0.3"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true

# Development profile with faster compile times
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Fast release builds (use: cargo build --profile release-fast)
[profile.release-fast]
inherits = "release"
lto = false
opt-level = 2
codegen-units = 16
