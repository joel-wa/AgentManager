<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium File Browser - Finder/Tesla Inspired</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            height: 100vh;
            display: flex;
            padding: 24px;
            overflow: hidden;
        }

        /* File Browser Container */
        .file-browser {
            width: 320px;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .browser-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Search Bar */
        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-1px);
        }

        /* File Tree */
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .file-tree::-webkit-scrollbar {
            width: 6px;
        }

        .file-tree::-webkit-scrollbar-track {
            background: transparent;
        }

        .file-tree::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* Folder/File Item */
        .tree-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            user-select: none;
        }

        .tree-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .tree-item.selected {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .tree-item.folder {
            font-weight: 500;
        }

        /* Chevron for expandable folders */
        .chevron {
            width: 16px;
            height: 16px;
            color: rgba(255, 255, 255, 0.4);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .tree-item.expanded .chevron {
            transform: rotate(90deg);
        }

        /* Icons */
        .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .icon.folder {
            color: #60a5fa;
        }

        .icon.file {
            color: rgba(255, 255, 255, 0.5);
        }

        .icon.code {
            color: #34d399;
        }

        .icon.json {
            color: #fbbf24;
        }

        .icon.image {
            color: #a78bfa;
        }

        /* Item Name */
        .item-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Nested items indentation */
        .nested {
            margin-left: 24px;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 32px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 13px;
            line-height: 1.5;
        }

        /* Status Footer */
        .browser-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: space-between;
        }

        svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="file-browser">
        <!-- Header with Search -->
        <div class="browser-header">
            <h3 class="header-title">Files</h3>
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Search files..."
                    id="searchInput"
                />
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                New
            </button>
            <button class="action-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                </svg>
                Refresh
            </button>
        </div>

        <!-- File Tree -->
        <div class="file-tree" id="fileTree">
            <!-- Folder: src -->
            <div class="tree-item folder expanded" onclick="toggleFolder(this)">
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
                <svg class="icon folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                <span class="item-name">src</span>
            </div>
            <div class="nested">
                <!-- Folder: components -->
                <div class="tree-item folder expanded" onclick="toggleFolder(this)">
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                    <svg class="icon folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="item-name">components</span>
                </div>
                <div class="nested">
                    <div class="tree-item selected">
                        <svg class="icon code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m18 16 4-4-4-4M6 8l-4 4 4 4"/>
                        </svg>
                        <span class="item-name">Header.tsx</span>
                    </div>
                    <div class="tree-item">
                        <svg class="icon code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m18 16 4-4-4-4M6 8l-4 4 4 4"/>
                        </svg>
                        <span class="item-name">ChatInterface.tsx</span>
                    </div>
                    <div class="tree-item">
                        <svg class="icon code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m18 16 4-4-4-4M6 8l-4 4 4 4"/>
                        </svg>
                        <span class="item-name">FileBrowser.tsx</span>
                    </div>
                </div>

                <!-- Folder: services -->
                <div class="tree-item folder" onclick="toggleFolder(this)">
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                    <svg class="icon folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="item-name">services</span>
                </div>

                <!-- File: App.tsx -->
                <div class="tree-item">
                    <svg class="icon code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m18 16 4-4-4-4M6 8l-4 4 4 4"/>
                    </svg>
                    <span class="item-name">App.tsx</span>
                </div>
            </div>

            <!-- Folder: public -->
            <div class="tree-item folder" onclick="toggleFolder(this)">
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
                <svg class="icon folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                <span class="item-name">public</span>
            </div>

            <!-- File: package.json -->
            <div class="tree-item">
                <svg class="icon json" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span class="item-name">package.json</span>
            </div>

            <!-- File: tsconfig.json -->
            <div class="tree-item">
                <svg class="icon json" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span class="item-name">tsconfig.json</span>
            </div>

            <!-- File: README.md -->
            <div class="tree-item">
                <svg class="icon file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6"/>
                </svg>
                <span class="item-name">README.md</span>
            </div>
        </div>

        <!-- Footer with Stats -->
        <div class="browser-footer">
            <span>28 items</span>
            <span>1.2 MB</span>
        </div>
    </div>

    <script>
        function toggleFolder(element) {
            element.classList.toggle('expanded');
            const nested = element.nextElementSibling;
            if (nested && nested.classList.contains('nested')) {
                nested.style.display = nested.style.display === 'none' ? 'block' : 'none';
            }
        }

        // File selection
        document.querySelectorAll('.tree-item:not(.folder)').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.tree-item').forEach(item => {
                const name = item.querySelector('.item-name').textContent.toLowerCase();
                if (name.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
