[project]
name = "agentmanager-python-services"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.7.0",
]

[dependency-groups]
main-agent = [
  "fastapi>=0.109.1",
  "uvicorn>=0.27.0",
  "httpx>=0.26.0",
  "pydantic>=2.5.0",
  "python-dotenv>=1.0.0",
]
maintenance-agent = [
  "fastapi>=0.109.1",
  "uvicorn>=0.27.0",
  "httpx>=0.26.0",
  "pydantic>=2.5.0",
  "python-dotenv>=1.0.0",
  "openai>=1.6.0",
  "anthropic>=0.10.0",
]
embeddings = [
  "fastapi>=0.109.1",
  "uvicorn>=0.27.0",
  "pydantic>=2.5.0",
  "sentence-transformers>=2.2.0",
  "numpy>=1.24.0",
  "torch>=2.0.0",
]
